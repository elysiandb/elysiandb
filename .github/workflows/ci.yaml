name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Ensure adminui dist exists
        run: mkdir -p adminui/dist

      - name: Verify go.mod
        run: go mod tidy && git diff --exit-code

      - name: Run tests (race)
        run: make test

      - name: Coverage (all packages)
        run: |
          COVERPKG=$(go list ./... | tr '\n' ',' | sed 's/,$//')
          TEST_PKGS=$(go list -f '{{if or (len .TestGoFiles) (len .XTestGoFiles)}}{{.ImportPath}}{{end}}' ./... | grep -v '^$')
          if [ -z "$TEST_PKGS" ]; then echo "no test packages"; exit 0; fi

          go test $TEST_PKGS -race -covermode=atomic -coverpkg="$COVERPKG" \
            -coverprofile=coverage.out -count=1

          go tool cover -func=coverage.out | tail

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  rust:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Ensure adminui dist exists
        run: mkdir -p adminui/dist

      - name: Verify Cargo.lock
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked --release -- --test-threads=1

  adminui:
    name: Admin UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminui

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: adminui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
