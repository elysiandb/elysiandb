name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Ensure adminui dist exists
        run: mkdir -p adminui/dist

      - name: Verify Cargo.lock
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: make test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        run: rustup toolchain install && rustup component add llvm-tools-preview

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Ensure adminui dist exists
        run: mkdir -p adminui/dist

      - name: Coverage
        run: cargo llvm-cov --workspace --locked --release --no-fail-fast --lcov --output-path lcov.info -- --test-threads=1 --skip overload_test::

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  talos:
    name: talos conformance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TEST262_COMMIT: cb4a6c8074671c00df8cbc17a620c0f9462b312a

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Fetch test262
        run: |
          git init -q "$RUNNER_TEMP/test262"
          git -C "$RUNNER_TEMP/test262" fetch -q --depth 1 https://github.com/tc39/test262.git "$TEST262_COMMIT"
          git -C "$RUNNER_TEMP/test262" checkout -q FETCH_HEAD

      - name: Run test262
        env:
          TALOS_TEST262_DIR: ${{ runner.temp }}/test262
        run: cargo test --locked --release -p talos --test test262 -- --ignored tc39 --test-threads=1

  cross-binary:
    name: Compatibility with v0.3.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASELINE_IMAGE: taymour/elysiandb:0.3.0
      V024_IMAGE: taymour/elysiandb:0.2.4
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Ensure adminui dist exists
        run: mkdir -p adminui/dist

      - name: Extract the Go binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          extract() {
            id=$(docker create --platform linux/amd64 "$1")
            docker cp "$id:/usr/local/bin/elysiandb" "$RUNNER_TEMP/bin/$2"
            docker rm "$id" > /dev/null
            chmod +x "$RUNNER_TEMP/bin/$2"
            file "$RUNNER_TEMP/bin/$2"
          }
          extract "$BASELINE_IMAGE" elysiandb-baseline
          extract "$V024_IMAGE" elysiandb-024

      - name: Build
        run: cargo build --locked --release --bin elysiandb --test e2e_process --test compat --test cross_binary

      - name: Rust writes first, then the baseline
        env:
          ELYSIANDB_PREVIOUS_BINARY: ${{ runner.temp }}/bin/elysiandb-baseline
          ELYSIANDB_V024_BINARY: ${{ runner.temp }}/bin/elysiandb-024
        run: |
          cargo test --locked --release --test e2e_process --test compat --test cross_binary -- --test-threads=1 --skip record_legacy_fixtures 2>&1 | tee "$RUNNER_TEMP/rust-first.log"
          if grep -n '^skipped:' "$RUNNER_TEMP/rust-first.log"; then exit 1; fi

      - name: Baseline writes first, then Rust, and the process suite on the baseline
        env:
          ELYSIANDB_BINARY: ${{ runner.temp }}/bin/elysiandb-baseline
          ELYSIANDB_PREVIOUS_BINARY: ${{ github.workspace }}/target/release/elysiandb
        run: |
          cargo test --locked --release --test e2e_process -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/go-first.log"
          if grep -n '^skipped:' "$RUNNER_TEMP/go-first.log"; then exit 1; fi

  adminui:
    name: Admin UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminui

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: adminui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker multi-arch build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: VERSION=ci

      - name: Check the images
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --build-arg VERSION=ci --load -t "elysiandb:ci-$arch" .
            id=$(docker create "elysiandb:ci-$arch")
            docker cp "$id:/usr/local/bin/elysiandb" "elysiandb-$arch"
            docker rm "$id"
            info=$(file "elysiandb-$arch")
            echo "$info"
            case "$info" in *"statically linked"* | *"static-pie linked"*) ;; *) exit 1 ;; esac
            docker run -d --name "elysiandb-$arch" "elysiandb:ci-$arch"
            status=starting
            for _ in $(seq 60); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "elysiandb-$arch")
              [ "$status" = starting ] || break
              sleep 2
            done
            docker logs "elysiandb-$arch"
            [ "$status" = healthy ]
            headers=$(docker exec "elysiandb-$arch" wget -qSO /dev/null http://127.0.0.1:8089/health 2>&1)
            echo "$headers"
            case "$headers" in *"X-Elysian-Version: ci"*) ;; *) exit 1 ;; esac
            docker rm -f "elysiandb-$arch"
          done
