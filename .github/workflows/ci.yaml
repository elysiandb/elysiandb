name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Ensure adminui dist exists
        run: mkdir -p adminui/dist

      - name: Verify go.mod
        run: go mod tidy && git diff --exit-code

      - name: Run tests (race)
        run: make test

      - name: Coverage (all packages)
        run: |
          COVERPKG=$(go list ./... | tr '\n' ',' | sed 's/,$//')
          TEST_PKGS=$(go list -f '{{if or (len .TestGoFiles) (len .XTestGoFiles)}}{{.ImportPath}}{{end}}' ./... | grep -v '^$')
          if [ -z "$TEST_PKGS" ]; then echo "no test packages"; exit 0; fi

          go test $TEST_PKGS -race -covermode=atomic -coverpkg="$COVERPKG" \
            -coverprofile=coverage.out -count=1

          go tool cover -func=coverage.out | tail

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  rust:
    name: Rust tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Ensure adminui dist exists
        run: mkdir -p adminui/dist

      - name: Verify Cargo.lock
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --release -- --test-threads=1

  cross-binary:
    name: Cross-binary tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASELINE_IMAGE: taymour/elysiandb:0.3.0
      V024_IMAGE: taymour/elysiandb:0.2.4
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Ensure adminui dist exists
        run: mkdir -p adminui/dist

      - name: Extract the Go binaries
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          extract() {
            id=$(docker create --platform linux/amd64 "$1")
            docker cp "$id:/usr/local/bin/elysiandb" "$RUNNER_TEMP/bin/$2"
            docker rm "$id" > /dev/null
            chmod +x "$RUNNER_TEMP/bin/$2"
            file "$RUNNER_TEMP/bin/$2"
          }
          extract "$BASELINE_IMAGE" elysiandb-baseline
          extract "$V024_IMAGE" elysiandb-024

      - name: Build
        run: cargo build --locked --release --bin elysiandb --test e2e_process --test compat --test cross_binary

      - name: Rust writes first, then the baseline
        env:
          ELYSIANDB_PREVIOUS_BINARY: ${{ runner.temp }}/bin/elysiandb-baseline
          ELYSIANDB_V024_BINARY: ${{ runner.temp }}/bin/elysiandb-024
        run: |
          cargo test --locked --release --test e2e_process --test compat --test cross_binary -- --test-threads=1 --skip record_legacy_fixtures 2>&1 | tee "$RUNNER_TEMP/rust-first.log"
          if grep -n '^skipped:' "$RUNNER_TEMP/rust-first.log"; then exit 1; fi

      - name: Baseline writes first, then Rust, and the process suite on the baseline
        env:
          ELYSIANDB_BINARY: ${{ runner.temp }}/bin/elysiandb-baseline
          ELYSIANDB_PREVIOUS_BINARY: ${{ github.workspace }}/target/release/elysiandb
        run: |
          cargo test --locked --release --test e2e_process -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/go-first.log"
          if grep -n '^skipped:' "$RUNNER_TEMP/go-first.log"; then exit 1; fi

  adminui:
    name: Admin UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminui

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: adminui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
