[package]
name = "elysiandb"
version = "0.0.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
publish = false
build = "build.rs"

[workspace]
members = ["crates/gocompat", "crates/goja"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "elysiandb"
path = "src/main.rs"

[dependencies]
arc-swap = "=1.7.1"
gocompat = { path = "crates/gocompat" }
libc = "=0.2.191"
mimalloc = "=0.1.52"

[[test]]
name = "pagetree_test"
path = "tests/internal/pagetree_test/main.rs"

[[test]]
name = "ptree_test"
path = "tests/internal/ptree_test/main.rs"

[[test]]
name = "memory_test"
path = "tests/internal/memory_test/main.rs"

[[test]]
name = "golden_engine"
path = "tests/golden_engine/main.rs"

[[test]]
name = "golden_persistence"
path = "tests/golden_persistence/main.rs"

[[test]]
name = "datastore_test"
path = "tests/internal/datastore_test/main.rs"

[[test]]
name = "durable_test"
path = "tests/internal/durable_test/main.rs"

[[test]]
name = "journal_test"
path = "tests/internal/journal_test/main.rs"

[[test]]
name = "legacy_test"
path = "tests/internal/legacy_test/main.rs"

[[test]]
name = "log_test"
path = "tests/internal/log_test/main.rs"

[[test]]
name = "golden_ops"
path = "tests/golden_ops/main.rs"

[[test]]
name = "configuration_test"
path = "tests/internal/configuration_test/main.rs"

[[test]]
name = "globals_test"
path = "tests/internal/globals_test/main.rs"

[[test]]
name = "storage_test"
path = "tests/internal/storage_test/main.rs"

[[test]]
name = "schema_test"
path = "tests/internal/schema_test/main.rs"

[profile.release]
strip = true
panic = "unwind"

[profile.dev]
panic = "unwind"
