store:
  folder: /tmp/elysiandb
  shards: 512
  flushIntervalSeconds: 5
  crashRecovery: { enabled: true, maxLogMB: 100 }
engine:
  name: "internal"  # options: "internal" (recommended), "mongodb" (beta)
  uri: "mongodb://elysian:elysian@localhost:27017/elysiandb"  # Only for non internal engine
server:
  http: { enabled: true,  host: 0.0.0.0, port: 8089 }
  tcp:  { enabled: true,  host: 0.0.0.0, port: 8088 }
log:
  level: info  # debug | info | warn | error
  format: text  # text | json
  accessLog: false  # one info line per HTTP request
  slowRequestMs: 500  # warn for requests slower than this; 0 disables
  bufferLines: 5000  # lines kept in memory for the Admin UI Logs page; 0 disables it
stats:
  enabled: false
security:
  authentication:
    enabled: true
    mode: user
    token: "your_secure_token_here"
api:
  schema:
    enabled: true
    strict: true
  index:
    workers: 4
  cache:
    enabled: true
    cleanupIntervalSeconds: 10
  hooks:
    enabled: true
adminui:
  enabled: true
monitoring:
  prometheus:
    enabled: false
