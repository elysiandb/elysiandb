store:
  folder: /data
  shards: 512
  flushIntervalSeconds: 5
  crashRecovery: { enabled: true, maxLogMB: 100 }
server:
  http: { enabled: true, host: 0.0.0.0, port: 8089 }
  tcp:  { enabled: true, host: 0.0.0.0, port: 8088 }
log:
  level: info
  format: text
  accessLog: false
  slowRequestMs: 500
  bufferLines: 5000
stats:
  enabled: false
security:
  authentication:
    enabled: false
    mode: token
    token: "your_secure_token_here"
api:
  index:
    workers: 4
  schema:
    enabled: true
    strict: false
  cache:
    enabled: true
    cleanupIntervalSeconds: 10
monitoring:
  prometheus:
    enabled: false
